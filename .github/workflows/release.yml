name: Portable release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run validate
      - run: ./scripts/build-portable.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-runtime-package
          path: .runtime/release/*.zip
          if-no-files-found: error
  build-macos:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run validate
      - run: npm run build:mac
      - uses: actions/download-artifact@v8.0.2
        with:
          name: windows-runtime-package
          path: .runtime/windows
      - name: 整理双端目录并验证 Mac 入口
        run: |
          mkdir -p .runtime/input-win .runtime/input-mac .runtime/unified
          ditto -x -k .runtime/windows/antigravity-desktop-zhcn-portable-win-x64.zip .runtime/input-win
          ditto -x -k .runtime/release/antigravity-desktop-zhcn-portable-macos-arm64.zip .runtime/input-mac
          node scripts/assemble-universal.mjs .runtime/input-win/antigravity-desktop-zhcn-portable-win-x64 .runtime/input-mac/antigravity-desktop-zhcn-portable-macos-arm64 .runtime/unified/antigravity汉化包
          node scripts/verify-universal.mjs .runtime/unified/antigravity汉化包
          mkdir -p .runtime/publish
          python3 scripts/package-release.py .runtime/unified/antigravity汉化包 .runtime/publish/Antigravity-Windows+Mac.zip
          python3 scripts/package-release.py .runtime/unified/antigravity汉化包/语言包 .runtime/publish/Language-Update-Only.zip
          mkdir -p .runtime/mac-extract
          ditto -x -k .runtime/publish/Antigravity-Windows+Mac.zip .runtime/mac-extract
          node scripts/verify-universal.mjs .runtime/mac-extract/antigravity汉化包
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: universal-release
          path: .runtime/publish/*
          if-no-files-found: error
  publish:
    needs: build-macos
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.22.2
      - uses: actions/download-artifact@v8.0.2
        with:
          name: universal-release
          path: .runtime/publish
      - name: 解压验证双端包的 Windows 入口
        shell: pwsh
        run: |
          $archive = (Resolve-Path .runtime/publish/Antigravity-Windows+Mac.zip).Path
          $shell = New-Object -ComObject Shell.Application
          $folder = $shell.NameSpace($archive)
          if (!$folder -or $folder.Items().Count -ne 1) { throw "Windows 资源管理器无法正常显示压缩包" }
          $root = $folder.Items().Item(0)
          if ($root.Name -ne 'antigravity汉化包' -or $root.GetFolder.Items().Count -ne 3) { throw "资源管理器中的包目录不完整" }
          Expand-Archive -LiteralPath $archive -DestinationPath .runtime/verify
          node scripts/verify-universal.mjs .runtime/verify/antigravity汉化包
          if ($LASTEXITCODE -ne 0) { throw "双端包 Windows 验证失败" }
      - name: 发布统一汉化包与独立语言包
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseNotes = (& node scripts/generate-release-notes.mjs) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "发布说明生成失败" }
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
          $files = Get-ChildItem .runtime/publish -File -Filter '*.zip'
          $hashes = ($files | ForEach-Object { "$($_.Name): $((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash)" }) -join "`n"
          $hashSection = "`n`n<details><summary>文件完整性校验（一般不用看）</summary>`n`n$hashes`n`n</details>`n"
          $releaseNotes += $hashSection
          [IO.File]::WriteAllText($notesFile, $releaseNotes)
          $artifacts = $files | ForEach-Object { if ($_.Name -eq 'Antigravity-Windows+Mac.zip') { "$($_.FullName)#Antigravity-完整汉化包-Windows+Mac.zip" } else { "$($_.FullName)#仅更新语言包-不能单独使用.zip" } }
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @artifacts --clobber
            if ($LASTEXITCODE -ne 0) { throw "上传发布附件失败" }
            # 发布已手动创建时保留原说明，只补上本次附件的校验值。
            $existingNotes = (gh release view $env:GITHUB_REF_NAME --json body --jq .body) -join "`n"
            if ($LASTEXITCODE -ne 0) { throw "读取发布说明失败" }
            $existingNotes = $existingNotes -replace '(?s)\s*<details><summary>文件完整性校验（一般不用看）</summary>.*?</details>\s*', ''
            [IO.File]::WriteAllText($notesFile, $existingNotes.TrimEnd() + $hashSection)
            gh release edit $env:GITHUB_REF_NAME --notes-file $notesFile
          } else {
            gh release create $env:GITHUB_REF_NAME @artifacts --notes-file $notesFile --title "$env:GITHUB_REF_NAME 双端统一汉化包" --draft
          }
          if ($LASTEXITCODE -ne 0) { throw "上传发布附件失败" }
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "公开发布失败" }
